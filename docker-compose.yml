version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: unpack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unpack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unpackpass}
      POSTGRES_DB: ${POSTGRES_DB:-unpack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unpack -d unpack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runner
    container_name: unpack-api
    restart: unless-stopped
    command: ["uvicorn", "server.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://unpack:unpackpass@postgres:5432/unpack
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runner
    container_name: unpack-worker
    restart: unless-stopped
    command: ["python", "-m", "server.app.jobs.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://unpack:unpackpass@postgres:5432/unpack
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: unpack-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles:
      - tunnel
    depends_on:
      - api

volumes:
  postgres_data:
