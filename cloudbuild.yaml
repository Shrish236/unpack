# Build the server image (API + worker + built UI) and push it to Artifact Registry.
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=asia-south1,_TAG=$(git rev-parse --short HEAD)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - server/Dockerfile
      - --target
      - runner
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/unpack/server:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/unpack/server:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/unpack/server:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/unpack/server:latest
substitutions:
  _REGION: asia-south1
  _TAG: manual
# Default build machine: new projects are not allowed larger machine types (quota) until support raises it.
timeout: 2400s
