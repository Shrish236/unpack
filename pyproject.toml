[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unpack"
version = "0.1.0"
description = "Turns AI-written code changes into an explained, explorable graph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Shrish" }
]
dependencies = [
    # unpack_graph dependencies
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "neo4j>=5.20.0",
    "jsonschema>=4.22.0",

    # server dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "google-genai>=1.0.0",
    "cryptography>=43.0.0",
    "playwright>=1.46.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.9",

    # CLI dependencies
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
unpack = "cli.main:main"
unpack-graph = "unpack_graph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["unpack_graph", "server", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
